<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оценки — КиноКнигоТЕКА</title>
    <link rel="stylesheet" href="/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header">
        <div class="container header-content">
            <a href="/" class="logo">
                <div class="logo-left">
                    <span class="logo-knigo">Книго</span>
                    <span class="logo-kino">Кино</span>
                </div>
                <span class="logo-teka">ТЕКА</span>
            </a>
            <nav class="nav">
                <a href="/books.html" class="nav-link">Книги</a>
                <a href="/movies.html" class="nav-link">Фильмы</a>
                <a href="/admin.html" class="nav-link nav-link--accent hidden">Админ-панель</a>
                <a href="/login.html" class="nav-link hidden" id="loginBtn">Войти</a>
                <a href="/profile.html" class="nav-link nav-link--accent hidden" id="profileBtn">Личный кабинет</a>
                <a href="#" class="nav-link nav-link--logout hidden" id="logoutBtn">Выйти</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <h1 class="page-title" id="pageTitle">Оценки</h1>

        <div id="ratingsContainer">
            <div class="loading">Загрузка оценок...</div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 КиноКнигоТЕКА. Дипломный проект.</p>
        </div>
    </footer>

    <script src="/app.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const type = urlParams.get('type');
        const id = urlParams.get('id');

        async function loadRatings() {
            if (!type || !id) {
                window.location.href = '/';
                return;
            }

            try {
                const ratings = await apiGet('/ratings/' + type + '/' + id);
                const entity = await apiGet('/' + type + 's/' + id);

                document.getElementById('pageTitle').textContent = 'Оценки: ' + entity.title;

                renderRatings(ratings);

            } catch (error) {
                document.getElementById('ratingsContainer').innerHTML =
                    '<div class="empty-state"><p>Ошибка загрузки оценок</p></div>';
            }
        }

        function renderRatings(ratings) {
            const container = document.getElementById('ratingsContainer');

            if (!ratings || ratings.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⭐</div>
                        <h3 class="empty-state-title">Оценок пока нет</h3>
                        <p>Станьте первым, кто оценит!</p>
                    </div>
                `;
                return;
            }

            let totalPlot = 0, totalChar = 0, totalOver = 0, totalAvg = 0;
            ratings.forEach(r => {
                totalPlot += r.plotScore;
                totalChar += r.characterScore;
                totalOver += r.overallScore;
                totalAvg += r.averageScore;
            });
            const count = ratings.length;

            const summaryHTML = `
                <div style="background: var(--color-surface); border-radius: var(--radius-md); padding: 24px; box-shadow: var(--shadow-sm); margin-bottom: 32px;">
                    <h2 style="margin-bottom: 16px;">Средние оценки (${count} ${declOfNum(count, ['оценка', 'оценки', 'оценок'])})</h2>
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">
                        <div>
                            <div style="color: var(--color-text-secondary); font-size: 14px;">Сюжет</div>
                            <div style="font-size: 24px; font-weight: 700;">${(totalPlot / count).toFixed(1)} / 5</div>
                        </div>
                        <div>
                            <div style="color: var(--color-text-secondary); font-size: 14px;">Персонажи</div>
                            <div style="font-size: 24px; font-weight: 700;">${(totalChar / count).toFixed(1)} / 5</div>
                        </div>
                        <div>
                            <div style="color: var(--color-text-secondary); font-size: 14px;">Общее впечатление</div>
                            <div style="font-size: 24px; font-weight: 700;">${(totalOver / count).toFixed(1)} / 5</div>
                        </div>
                        <div>
                            <div style="color: var(--color-text-secondary); font-size: 14px;">Средняя</div>
                            <div style="font-size: 28px; font-weight: 800; color: var(--color-primary);">${(totalAvg / count).toFixed(1)} / 5</div>
                        </div>
                    </div>
                </div>
            `;

            const reviewsHTML = ratings.map(r => `
                <div style="background: var(--color-surface); border-radius: var(--radius-md); padding: 24px; box-shadow: var(--shadow-sm); margin-bottom: 16px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                        <div style="font-weight: 700; font-size: 16px;">
                            👤 ${r.user.fullName || r.user.username}
                        </div>
                        <div style="color: var(--color-star); font-size: 20px;">
                            ${renderStars(r.averageScore)} <span style="color: var(--color-text); font-weight: 700;">${r.averageScore.toFixed(1)}</span>
                        </div>
                    </div>
                    <div style="display: flex; gap: 16px; font-size: 13px; color: var(--color-text-secondary); margin-bottom: 12px; flex-wrap: wrap;">
                        <span>Сюжет: <b>${r.plotScore}</b>/5</span>
                        <span>Персонажи: <b>${r.characterScore}</b>/5</span>
                        <span>Общее: <b>${r.overallScore}</b>/5</span>
                    </div>
                    ${r.comment ? `<p style="line-height: 1.6; color: var(--color-text);">${r.comment}</p>` : '<p style="color: var(--color-text-secondary); font-style: italic;">Без комментария</p>'}
                </div>
            `).join('');

            container.innerHTML = summaryHTML + reviewsHTML;
        }

        document.addEventListener('DOMContentLoaded', loadRatings);
    </script>
</body>
</html>
